name: Android CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Debug APK + Release AAB
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Surface signing secrets at JOB level so the release-AAB steps' `if:`
      # conditions can see them. A step's own `env:` is NOT in scope for that
      # same step's `if` expression, so the previous step-scoped gating always
      # evaluated to '' and silently skipped the signed release build.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle permissions
        run: chmod +x gradlew

      # ── Debug APK (no signing required) ──────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release AAB ──────────────────────────────────────────────────────
      # Always build the release bundle so R8 (minify + resource shrinking) is
      # exercised on every run. It is SIGNED with the upload keystore when the
      # signing secrets are present, and built UNSIGNED otherwise (R8 is still
      # validated; an unsigned AAB just cannot be uploaded to Play).
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Write key.properties
        if: ${{ env.STORE_PASSWORD != '' }}
        run: |
          cat > key.properties <<EOF
          storeFile=../my-upload-key.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build release bundle (R8)
        run: ./gradlew bundleRelease --no-daemon

      - name: Report signing status
        run: |
          if [ -n "${STORE_PASSWORD}" ]; then
            echo "::notice title=Release AAB signed::Built and signed with the upload keystore — ready for Play upload."
          else
            echo "::warning title=Release AAB unsigned::R8 release build succeeded but the AAB is UNSIGNED (signing secrets not set), so it cannot be uploaded to Play. Add repository secrets KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS."
          fi

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── Unit tests ────────────────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 14

      # ── QA screenshot generation ──────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install screenshot deps
        run: pip install Pillow

      - name: Generate QA screenshots
        run: python3 tools/render_qa_screenshots.py

      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: qa_screenshots/
          retention-days: 30
